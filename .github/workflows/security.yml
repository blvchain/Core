name: security

# Phase S — dependency & vulnerability scanning.
# Gates: no known exploitable High/Critical vulnerability in the pinned set
# without a documented, reviewed exception (see docs/ARCHITECTURE_PHASE3.md §17).
# This workflow scans only; it does not modify dependencies.

on:
  push:
    branches: [ main, "phase-s/**", "phase-*/**" ]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF where supported

env:
  # Pinned Go toolchain (Phase S selection; keep in sync with go.mod `toolchain`).
  GO_VERSION: "1.26.11"

jobs:
  govulncheck:
    name: govulncheck (reachability-aware Go vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: Run govulncheck (gating)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...

  osv-scanner:
    name: OSV-Scanner (lockfile / go.mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Scan with OSV-Scanner
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest
          osv-scanner --lockfile=go.mod
          # To scan the SBOM instead: osv-scanner --sbom=docs/phase-s/sbom.cyclonedx.json

  sbom:
    name: SBOM (Syft) + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX + SPDX SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom/cyclonedx.json
          upload-artifact: true
          artifact-name: sbom-cyclonedx
      - name: Generate SPDX SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom/spdx.json
          upload-artifact: true
          artifact-name: sbom-spdx
      - name: Trivy filesystem + config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ./
          severity: HIGH,CRITICAL
          exit-code: "1"          # fail on High/Critical (policy: reviewed exceptions only)
          ignore-unfixed: false
          format: table